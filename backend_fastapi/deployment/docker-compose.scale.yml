# ============================================================================
#  Manga Website — Scale overlay (local "workaround" infra for ~100k users)
# ============================================================================
#  There is no managed cloud in this setup, so this overlay demonstrates the
#  same scaling shape locally with plain Docker Compose:
#
#    * PgBouncer connection pooling in front of Postgres (so hundreds of app +
#      worker connections collapse onto a small server-side pool).
#    * One Celery worker PER queue (matching the item-38 task routing) so a
#      flood of one job type (e.g. a big scrape) can't starve email/maintenance.
#
#  Run it layered on top of the base stack:
#
#    docker compose -f docker-compose.yml -f backend_fastapi/deployment/docker-compose.scale.yml up -d
#
#  Scale a hot queue horizontally:
#
#    docker compose -f docker-compose.yml -f backend_fastapi/deployment/docker-compose.scale.yml \
#      up -d --scale celery_worker_scrape=3
#
#  When you DO get a cloud account, the reference Terraform + k8s sketches under
#  a managed
#  equivalent (RDS + read replica, ElastiCache, HPA on the workers).
#
#  NOTE on PgBouncer + SQLAlchemy: this uses transaction pooling (POOL_MODE=
#  transaction), which is safe with psycopg2 (no server-side prepared
#  statements). If you switch the driver to psycopg3/asyncpg or start using
#  server-side cursors, move to session pooling or disable statement caching.
# ============================================================================

x-scale-worker: &scale-worker
  image: manga-backend:latest
  build:
    context: .
    dockerfile: backend_fastapi/Dockerfile
  pull_policy: build
  restart: unless-stopped
  env_file:
    - .env
  # Workers reach Postgres THROUGH PgBouncer, not the db container directly.
  environment: &scale-worker-env
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg2://manga:${POSTGRES_PASSWORD:-changeme}@pgbouncer:6432/manga
    REDIS_URL: ${REDIS_URL}
    REDIS_USERNAME: ${REDIS_USERNAME}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    SECRET_KEY: ${SECRET_KEY}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
    INTEGRATIONS_SECRET: ${INTEGRATIONS_SECRET}
    EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:?Set EMAIL_ENCRYPTION_KEY to a Fernet key (see .env.example)}
    ALGORITHM: ${ALGORITHM:-HS256}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
    GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
    DEFAULT_OCR_ENGINE: ${DEFAULT_OCR_ENGINE}
    DEFAULT_TRANSLATION_PROVIDER: ${DEFAULT_TRANSLATION_PROVIDER}
    PYTHONPATH: /app/backend_fastapi
    PROFILE_UPLOAD_DIR: /app/storage/profile_uploads
    BRANDING_UPLOAD_DIR: /app/storage/branding/uploads
    BRANDING_ASSET_DIR: /app/storage/branding/public
  command: ["/usr/bin/env", "sh", "/app/backend_fastapi/scripts/start_celery_worker.sh"]
  # Per-container check (broker + live worker process), not the backend's /healthz.
  healthcheck:
    test: ["CMD", "python", "/app/backend_fastapi/scripts/celery_healthcheck.py", "worker"]
    interval: 15s
    timeout: 10s
    start_period: 30s
    retries: 3
  volumes:
    - app-storage:/app/storage
  depends_on:
    pgbouncer:
      condition: service_started
    redis:
      condition: service_healthy
    backend:
      condition: service_healthy
  networks:
    - manga-network

services:
  # ------------------------------------------------------------------
  # PgBouncer — connection pooler in front of the db container.
  # ------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p2
    container_name: manga-stack-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: manga
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DB_NAME: manga
      LISTEN_PORT: "6432"
      # Client-facing auth is md5 (independent of the server's scram-sha-256);
      # PgBouncer speaks scram to the server using DB_PASSWORD.
      AUTH_TYPE: md5
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      # statement_timeout etc. are sent by the app as libpq startup options;
      # let them pass through instead of PgBouncer rejecting them.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U manga || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - manga-network

  # ------------------------------------------------------------------
  # Route the API through PgBouncer too (not just the workers).
  # ------------------------------------------------------------------
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg2://manga:${POSTGRES_PASSWORD:-changeme}@pgbouncer:6432/manga
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      manga-stack-migrate:
        condition: service_completed_successfully

  # ------------------------------------------------------------------
  # Demote the base single worker to the light control/default queue —
  # the per-queue workers below handle the routed heavy work.
  # (The migrate job still connects to db DIRECTLY, not through the pooler.)
  # ------------------------------------------------------------------
  celery_worker:
    environment:
      CELERY_QUEUES: "default,celery"
      CELERY_CONCURRENCY: "2"
      DATABASE_URL: postgresql+psycopg2://manga:${POSTGRES_PASSWORD:-changeme}@pgbouncer:6432/manga

  # No container_name on any of these: `up --scale celery_worker_scrape=3`
  # (documented in this file's header) cannot start a second replica while the
  # service is pinned to one fixed name.
  celery_worker_scrape:
    <<: *scale-worker
    environment:
      <<: *scale-worker-env
      CELERY_QUEUES: scrape
      CELERY_CONCURRENCY: "4"

  celery_worker_ocr:
    <<: *scale-worker
    environment:
      <<: *scale-worker-env
      CELERY_QUEUES: ocr
      CELERY_CONCURRENCY: "2"

  celery_worker_translation:
    <<: *scale-worker
    environment:
      <<: *scale-worker-env
      CELERY_QUEUES: translation
      CELERY_CONCURRENCY: "4"

  celery_worker_email:
    <<: *scale-worker
    environment:
      <<: *scale-worker-env
      CELERY_QUEUES: email
      CELERY_CONCURRENCY: "2"

  celery_worker_maintenance:
    <<: *scale-worker
    environment:
      <<: *scale-worker-env
      CELERY_QUEUES: maintenance
      CELERY_CONCURRENCY: "2"

  celery_worker_notifications:
    <<: *scale-worker
    environment:
      <<: *scale-worker-env
      CELERY_QUEUES: notifications
      CELERY_CONCURRENCY: "2"
