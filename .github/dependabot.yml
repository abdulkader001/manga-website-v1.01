# Dependabot opens the update pull requests. Everything is pinned to exact
# versions (or digests for images), so nothing updates unless one of these PRs
# is merged. How to review them: deployment/updating.md.

version: 2
updates:
  - package-ecosystem: pip
    directory: /backend_fastapi
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch churn; anything major still arrives on
      # its own, where it can be read properly.
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # package.json and package-lock.json live at the repository root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Vite 8 swaps the bundler and needs a config rewrite (vite.config.ts uses
      # esbuild-only hooks); take it as a planned change, not a bump.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Base images, pinned by digest in the Dockerfiles and compose file.
  - package-ecosystem: docker
    directory: /backend_fastapi
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
