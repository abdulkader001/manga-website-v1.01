[alembic]
script_location = %(here)s/backend_fastapi/app/migrations
timezone = UTC
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = true
# No sqlalchemy.url here on purpose: env.py requires the DATABASE_URL
# environment variable and refuses to fall back to a default database.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
