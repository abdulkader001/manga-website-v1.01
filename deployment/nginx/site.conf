# The site configuration baked into the `web` image as
# /etc/nginx/conf.d/default.conf (see deployment/web.Dockerfile). This is the ONLY
# frontend site config the deployed stack uses -- `frontend/nginx.conf` and
# `nginx/conf.d/default.conf` were orphaned duplicates that no build or
# compose file referenced, which is how the security headers, gzip and cache
# rules they contained never actually shipped (F-74). They have been removed;
# everything they had that was worth keeping lives here.
#
# The http-level directives this file relies on (limit_conn_zone,
# client_max_body_size, slow-loris timeouts) live in deployment/nginx/nginx.conf,
# which the same image installs as /etc/nginx/nginx.conf.

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---------------------------------------------------------------------
  # Compression (F-74). Without this the main bundle went out at 384 KB
  # instead of ~117 KB on every cold visit.
  #
  # application/wasm matters more than the bundle does. The PP-OCRv5 runtime
  # (`ort-wasm-simd-threaded.jsep.*.wasm`) is 25.6 MB uncompressed and 6.0 MB
  # gzipped -- a 19.6 MB difference for every reader who opens the OCR
  # overlay. It is lazily imported (`await import("onnxruntime-web")` in
  # plugins/ocr/ppocrWorker.ts), so it never touches a plain reading session,
  # but it was going out uncompressed to everyone who did use OCR. The
  # compression cost is paid once per release per user: these assets are
  # content-hashed and served `immutable` below.
  # ---------------------------------------------------------------------
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/wasm
    application/json
    application/xml
    application/xml+rss
    font/woff
    font/woff2
    image/svg+xml;

  # ---------------------------------------------------------------------
  # Security headers (F-74). `always` so they survive error responses too.
  #
  # The CSP is an explicit allowlist rather than a bare `default-src 'self'`.
  # Each relaxation below is required by something the app actually does:
  #
  #   script-src 'self' 'wasm-unsafe-eval'
  #       No 'unsafe-inline' and no 'unsafe-eval' -- the two that matter for
  #       XSS. The build sets INLINE_RUNTIME_CHUNK=false so index.html carries
  #       no inline <script>. 'wasm-unsafe-eval' is required to compile the
  #       OCR WebAssembly (onnxruntime-web / tesseract.js); without it Chrome
  #       refuses WebAssembly.instantiate and OCR silently stops working.
  #   style-src 'self' 'unsafe-inline'
  #       React sets element style attributes directly (ad slot sizing,
  #       virtualised grid positioning), which counts as inline style.
  #   img-src 'self' https: data: blob:
  #       Covers, page images and ad creatives are fetched from arbitrary
  #       upstream hosts; canvas/OCR work produces blob: images.
  #   connect-src 'self' https:
  #       tesseract.js fetches its wasm core and language data from a CDN.
  #   worker-src 'self' blob:
  #       Both OCR engines run in workers created from blob URLs.
  #
  # Ad slots of type "html" are sandboxed iframes whose markup is
  # DOMPurify-sanitised, so they need nothing extra. Ad slots of type
  # "script" inject a third-party <script src>: to use those, add that ad
  # network's exact origin to script-src here -- do not open it to `https:`.
  # ---------------------------------------------------------------------
  add_header X-Content-Type-Options   "nosniff" always;
  add_header X-Frame-Options          "DENY" always;
  add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy  "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; media-src 'self' https: blob:; frame-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  # HSTS is only correct where TLS is actually terminated. This server block
  # listens on plain HTTP behind a TLS-terminating proxy, so the proxy owns
  # the header (see deployment/manga-site.conf); emitting it here would pin
  # plain-HTTP dev stacks to HTTPS as well.

  # ---------------------------------------------------------------------
  # Health: proxy to the backend so the container's health status reflects
  # something real (F-50). The previous static `return 200 'ok'` reported
  # healthy straight through a backend outage.
  # ---------------------------------------------------------------------
  location = /healthz {
    access_log off;
    proxy_pass http://backend:8000/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # ---------------------------------------------------------------------
  # Admin API network exposure (4G.4): where the platform owner has a fixed
  # set of admin source IPs (office/VPN egress), uncomment and fill them in
  # so the admin surface is not reachable from the entire internet, on top of
  # the permission checks the API already enforces.
  #
  # F-69: this must be keyed to /api/v1/admin/ -- the canonical mount. The
  # previous version matched /api/admin/ and proxied to /admin/, a prefix the
  # application does not serve, so it would have 404'd every admin request
  # the moment it was enabled. It is declared before the general /api/
  # location because nginx prefers the longest matching prefix.
  # ---------------------------------------------------------------------
  # location /api/v1/admin/ {
  #   allow 203.0.113.0/24;   # replace with the real admin source range(s)
  #   deny all;
  #   limit_conn conn_per_ip 20;
  #   proxy_pass http://backend:8000;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, not append (F-62)
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_set_header Connection "";
  # }

  # SEO feeds are generated by the backend from the live catalogue.
  location ~ ^/(sitemap\.xml|rss\.xml|feed\.xml)$ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # Compressed chapter pages and covers are content-addressed static files that
  # the backend writes to the shared storage volume. nginx serves them itself
  # (sendfile, conditional requests, one-year immutable cache) so the API
  # process never handles image bytes. If the volume is not mounted here the
  # request 404s -- mount `app-storage` read-only into this container (see
  # docker-compose.yml), or delete these two locations to fall back to the API.
  location ^~ /api/v1/manga/pages/ {
    alias /app/storage/pages/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /api/v1/manga/covers/ {
    alias /app/storage/covers/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /api/ {
    # Connection limit (4G.1): caps concurrent connections per source IP so
    # one source can't exhaust the worker pool; the app-level rate limiter
    # (per-request, with progressive backoff) handles request-rate abuse.
    limit_conn conn_per_ip 20;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, don't append (F-62): $proxy_add_x_forwarded_for chains onto
    # whatever the client sent, letting a spoofed value survive as the first
    # (and previously trusted) hop. $remote_addr is the one value nginx
    # itself attests to.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
  }

  # ---------------------------------------------------------------------
  # Static assets: CRA fingerprints filenames, so they are immutable (F-74).
  # ---------------------------------------------------------------------
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|png|jpe?g|gif|svg|webp|avif|wasm)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # index.html and the runtime config carry the pointers to those hashed
  # assets, so they must never be cached.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }

  location = /config.json {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Source maps must never be served in production. The build no longer emits
  # them (GENERATE_SOURCEMAP=false, F-71); this is the belt-and-braces half,
  # so a map that slips into an image is still unreachable over HTTP.
  location ~* \.map$ {
    access_log off;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
