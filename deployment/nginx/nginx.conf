pid /tmp/nginx.pid;

# Visitors' IP addresses are for the owner only and never go into a log line
# (house rule). nginx prints the client address in every error-log line
# ("client: ..."), so only critical messages are logged. To debug for a
# moment, change `crit` to `error`, reload, and change it back afterwards.
error_log /var/log/nginx/error.log crit;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Access log without the visitor's address (house rule, see error_log).
    log_format no_ip '$time_iso8601 "$request" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log no_ip;

    # -----------------------------------------------------------------
    # The TLS proxy in front (Caddy on the host, GUIDE section 8 step 7)
    # connects from loopback or the Docker network. Without these lines
    # nginx saw only that proxy: every visitor shared one address (one
    # rate-limit bucket for the whole site, Geolock blocked nobody) and the
    # request looked like plain HTTP, so the backend redirected every API
    # call to https:// in a loop (plan.md P0-1, P0-2).
    #
    # Only these ranges may tell us the visitor's address and the scheme.
    # If something else sits in front of Caddy (a load balancer), add its
    # range here and to TRUSTED_PROXY_CIDRS in .env.
    # -----------------------------------------------------------------
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from ::1/128;
    set_real_ip_from fc00::/7;
    # The last address in X-Forwarded-For is the one the proxy itself
    # added; anything before it was written by the visitor.
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # $realip_remote_addr is the proxy's own address (before the line above
    # replaced $remote_addr). Same ranges as set_real_ip_from.
    geo $realip_remote_addr $from_trusted_proxy {
        default         0;
        127.0.0.0/8     1;
        10.0.0.0/8      1;
        172.16.0.0/12   1;
        192.168.0.0/16  1;
        ::1/128         1;
        fc00::/7        1;
    }

    # The scheme the visitor used: the proxy's X-Forwarded-Proto when a
    # trusted proxy sent one, otherwise how the request reached nginx.
    map "$from_trusted_proxy:$http_x_forwarded_proto" $fwd_proto {
        default   $scheme;
        "1:https" https;
        "1:http"  http;
    }

    # Baseline attack defense active from first deployment, independent of
    # whether a CDN/WAF is in front (SRS 4G.1):
    #   - limit_conn_zone: per-IP concurrent connection cap (applied in
    #     conf.d/default.conf), so one source can't hold the worker pool
    #     open indefinitely.
    #   - client_max_body_size: rejects oversized request bodies before any
    #     application logic runs.
    #   - client_body_timeout / client_header_timeout: slow-loris protection
    #     -- connections that open and trickle data are dropped rather than
    #     held open forever.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    client_max_body_size 10m;

    # Roadmap items 4 and 6. Zones are applied in conf.d/default.conf:
    #   - img_per_ip / conn_img_per_ip: page and cover pictures. A reader loads
    #     a whole chapter in a burst, so the rate is generous; it stops a
    #     scraper pulling the library, not a person reading.
    #   - login_per_ip: the sign-in endpoints (Google login and callbacks,
    #     magic-link request and redeem). The API enforces its own per-IP and
    #     per-account limits behind this.
    limit_req_zone $binary_remote_addr zone=img_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_img_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_status 429;

    # Hotlink protection for pictures. $hotlink_blocked is 1 only when the
    # request carries an http(s) Referer whose host is neither this site's
    # own host nor an allowed partner. An empty Referer (direct visit, privacy
    # settings, apps) and non-http referers are allowed. To allow another
    # site, add a line like:
    #   "~^https?://([^/|:]+\.)?partner\.example(:[0-9]+)?(/[^|]*)?\|" 0;
    map "$http_referer|$host" $hotlink_blocked {
        default 1;
        "~^\|" 0;
        "~^(?!https?://)" 0;
        "~^https?://(?<ref_host>[^/|:]+)(:[0-9]+)?(/[^|]*)?\|\k<ref_host>$" 0;
    }
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 20s;

       include /etc/nginx/conf.d/*.conf;
}
