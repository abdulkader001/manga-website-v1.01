# ===========================
# HTTP → HTTPS redirect
# ===========================
server {
    listen 80;
    server_name manga.example.com www.manga.example.com;
    return 301 https://$host$request_uri;
}

# ===========================
# Environment overrides for rate limits
# ===========================
env RATE_LIMIT_HOURLY;
env RATE_LIMIT_DAILY;

map $RATE_LIMIT_HOURLY $api_rate_hourly {
    default $RATE_LIMIT_HOURLY;
    ""      500r/h;
}

map $RATE_LIMIT_DAILY $api_rate_daily {
    default $RATE_LIMIT_DAILY;
    ""      2000r/d;
}

# ===========================
# Basic request throttling for abuse (optional, safe defaults)
# ===========================
limit_req_zone $binary_remote_addr zone=api_hourly:10m rate=$api_rate_hourly;
limit_req_zone $binary_remote_addr zone=api_daily:10m rate=$api_rate_daily;

# Baseline attack defense active from first deployment, independent of
# whether a CDN/WAF is in front (SRS 4G.1): per-IP concurrent connection cap,
# on top of the per-request rate limits above and the app's own progressive
# rate-limit backoff.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ===========================
# Upstream pool (Docker hosts)
# Note: names must match docker-compose service names
# ===========================
upstream backend_pool {
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# ===========================
# HTTPS server
# ===========================
server {
    listen 443 ssl http2;
    server_name manga.example.com www.manga.example.com;

    # Baseline attack defense (SRS 4G.1): request-size cap enforced before
    # any application logic runs, and slow-loris protection (connections
    # that open and trickle data are dropped rather than held open forever).
    client_max_body_size 10m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 20s;

    # TLS certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/manga.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manga.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/manga.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!DSS";
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;

    # -------------------------
    # Security / privacy headers
    # -------------------------
    # `preload` is deliberate but not reversible on a whim: once the domain is
    # submitted to hstspreload.org, browsers ship it baked in, and removal
    # takes months. Drop the token if you are not ready to commit the apex
    # domain and every subdomain to HTTPS indefinitely.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Kept in step with the container config (deployment/nginx/site.conf) — see the long
    # comment there for why each relaxation is needed. The previous policy
    # here allowed 'unsafe-inline' and 'unsafe-eval' in script-src and `*` for
    # frames, which is close to having no policy at all: an injected inline
    # script would have executed. The app loads no third-party scripts and no
    # external comment provider (the native comment system replaced it), so
    # nothing needs that latitude.
    #
    # Ad slots of type "script" inject a third-party <script src>: to use
    # those, add that ad network's exact origin to script-src. Do not open it
    # back up to `https:`.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; media-src 'self' https: blob:; frame-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # -------------------------
    # SPA (React) static hosting
    # -------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Ensure index.html never cached
    location = /index.html {
        root /usr/share/nginx/html;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Static assets strong cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Source maps are never generated for production builds (F-71); this is
    # the belt-and-braces half in case one reaches the document root.
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    # Healthcheck proxies real backend status
    location /health {
        proxy_pass http://backend_pool/healthz;
    }

    # -------------------------
    # API proxy to backend pool with rate limiting
    # -------------------------
    location /api/ {
         limit_req zone=api_hourly burst=30 nodelay;
        limit_req zone=api_daily burst=200;
        # Per-IP concurrent connection cap (4G.1) -- caps how many requests
        # one source can have in flight at once, on top of the request-rate
        # limits above.
        limit_conn conn_per_ip 20;

        proxy_cookie_flags ~*jwt Secure HttpOnly SameSite=None;

        proxy_pass http://backend_pool;
        proxy_http_version 1.1;

        # Websocket / streaming safety
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, don't append (F-62): $proxy_add_x_forwarded_for chains
        # onto whatever the client sent, letting a spoofed value survive as
        # the trusted first hop. $remote_addr is the one value nginx itself
        # attests to.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
    }

    # Storage & Backups (Admin): archives can be many GB -- no size cap or
    # buffering here; the API itself only lets the main admin through.
    location ~ ^/api/(?:v1/)?admin/(?:backups/(?:upload|files/)|geolock/database/upload) {
        limit_conn conn_per_ip 4;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Admin panel network exposure (4G.4): where the platform owner has a
    # fixed set of admin source IPs (office/VPN egress), uncomment and fill
    # them in so /api/admin/ is not reachable from the entire internet, on
    # top of the require_admin_user auth check the API already enforces.
    # Left commented by default since no fixed IP set exists yet.
    # F-69: keyed to /api/v1/admin/, the prefix the application actually
    # serves. The previous version matched /api/admin/ and proxied to
    # /admin/, which would have 404'd every admin request once enabled.
    # location /api/v1/admin/ {
    #   allow 203.0.113.0/24;   # replace with the real admin source range(s)
    #   deny all;
    #   limit_conn conn_per_ip 20;
    #   proxy_pass http://backend_pool;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $remote_addr;  # overwrite, not append (F-62)
    #   proxy_set_header X-Forwarded-Proto https;
    # }

    # Gzip. Kept in step with the container site config in deployment/nginx/site.conf --
    # text/javascript because the build emits .mjs, and application/wasm
    # because the lazily-loaded PP-OCRv5 runtime is 25.6 MB raw against
    # 6.0 MB gzipped.
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/wasm application/json font/woff2 image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
}
