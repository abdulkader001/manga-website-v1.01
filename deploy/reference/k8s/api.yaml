# Reference k8s — FastAPI API Deployment + Service + HPA. REFERENCE ONLY.
# Replace image/secret/config refs, then `kubectl apply -f .`.
# Reads DATABASE_URL (writer via RDS Proxy) and DATABASE_READ_URL (replica,
# item 32) from backend-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manga-api
  labels: { app.kubernetes.io/name: manga-api, app.kubernetes.io/part-of: manga }
spec:
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: manga-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: manga-api }
    spec:
      containers:
        - name: api
          # D-4: pin to an immutable tag or digest before applying.
          image: manga-backend:REPLACE_WITH_IMAGE_TAG
          command: ["/usr/bin/env", "sh", "/app/backend_fastapi/scripts/start_backend.sh"]
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: manga-api
  labels: { app.kubernetes.io/name: manga-api, app.kubernetes.io/part-of: manga }
spec:
  selector: { app.kubernetes.io/name: manga-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: manga-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: manga-api }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
