# Reference k8s — one-shot Alembic migration Job. REFERENCE ONLY.
# Run this to completion BEFORE rolling out manga-api (mirror of the
# manga-stack-migrate service in docker-compose.yml). Connects to the DB
# writer DIRECTLY (not through the pooler) — DDL should not run in a
# transaction-pooled connection.
apiVersion: batch/v1
kind: Job
metadata:
  name: manga-migrate
  labels: { app.kubernetes.io/name: manga-migrate, app.kubernetes.io/part-of: manga }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: manga-migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: manga-backend:latest
          workingDir: /app
          command: ["sh", "-c", "alembic upgrade head && python scripts/seed_bootstrap_state.py"]
          env:
            - name: ALEMBIC_CONFIG
              value: /app/alembic.ini
            - name: PYTHONPATH
              value: /app/backend_fastapi
            # Direct writer endpoint — NOT the RDS Proxy / PgBouncer endpoint.
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: backend-secrets, key: DATABASE_WRITER_DIRECT_URL } }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
